<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resident Payment Portal - RT 001/001</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --bg-main: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --success-bg: #dcfce7;
            --success-text: #166534;
            --error-bg: #fee2e2;
            --error-text: #991b1b;
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: 'Inter', sans-serif; 
        }

        body { 
            background: var(--bg-main); 
            color: var(--text-main);
            display: flex; 
            justify-content: center; 
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card { 
            background: var(--card-bg); 
            padding: 40px 32px; 
            border-radius: 24px; 
            width: 100%; 
            max-width: 420px; 
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
        }

        .header-container {
            text-align: center;
            margin-bottom: 32px;
        }

        .icon-wrapper {
            font-size: 32px;
            margin-bottom: 12px;
        }

        h3 {
            font-size: 22px;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        p.subtitle {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.5;
        }

        .input-group {
            margin-bottom: 16px;
        }

        .input-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 6px;
        }

        input { 
            width: 100%; 
            padding: 14px 16px; 
            border-radius: 12px; 
            border: 1px solid var(--border-color); 
            background: #f1f5f9;
            font-size: 14px;
            transition: all 0.3s ease;
            color: var(--text-main);
        }

        input::placeholder {
            color: #94a3b8;
        }

        input:focus { 
            outline: none; 
            border-color: var(--primary); 
            background: #ffffff; 
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1); 
        }

        button { 
            width: 100%; 
            padding: 16px; 
            margin-top: 12px;
            border-radius: 12px; 
            background: var(--primary); 
            color: white; 
            border: none; 
            font-weight: 600; 
            font-size: 15px;
            cursor: pointer; 
            transition: all 0.2s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        button:hover { 
            background: var(--primary-dark); 
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            background: #94a3b8;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .alert-box {
            margin-top: 20px;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 500;
            text-align: center;
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .alert-success {
            display: block;
            background: var(--success-bg);
            color: var(--success-text);
            border: 1px solid #bbf7d0;
        }

        .alert-error {
            display: block;
            background: var(--error-bg);
            color: var(--error-text);
            border: 1px solid #fecaca;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="header-container">
            <div class="icon-wrapper">🛡️</div>
            <h3>Payment Submission</h3>
            <p class="subtitle">Securely submit your monthly fees or donations for Admin verification.</p>
        </div>

        <div class="input-group">
            <label for="name">Resident Identity</label>
            <input type="text" id="name" placeholder="e.g. John Doe / Block A-12" oninput="hideAlert()">
        </div>

        <div class="input-group">
            <label for="amt">Payment Amount</label>
            <input type="number" id="amt" placeholder="Rp 0" oninput="hideAlert()">
        </div>

        <div class="input-group">
            <label for="desc">Payment Purpose</label>
            <input type="text" id="desc" placeholder="e.g. June Monthly Security Fee" oninput="hideAlert()">
        </div>

        <button id="submitBtn" onclick="submitData()">
            Send Payment Report
        </button>

        <div id="msgBox" class="alert-box"></div>
    </div>

    <script>
        const SB_URL = 'https://ltndiinbhxpstzkfroqc.supabase.co';
        const SB_KEY = 'sb_publishable_nhL1q3f6pZvD396R-T_N9Q_JE996i25';
        const sbClient = supabase.createClient(SB_URL, SB_KEY);

        function hideAlert() {
            document.getElementById('msgBox').className = 'alert-box';
        }

        function showAlert(message, type) {
            const msgBox = document.getElementById('msgBox');
            msgBox.innerText = message;
            msgBox.className = `alert-box alert-${type}`;
        }

        async function submitData() {
            const name = document.getElementById('name').value.trim();
            const amt = document.getElementById('amt').value.trim();
            const desc = document.getElementById('desc').value.trim();
            const btn = document.getElementById('submitBtn');

            if (!name || !amt || !desc) {
                showAlert("Please fill out all fields before submitting.", "error");
                return;
            }

            // Set Loading State
            btn.disabled = true;
            btn.innerHTML = "⏳ Submitting...";
            hideAlert();

            const { error } = await sbClient.from('transaksi').insert([{
                keterangan: `[CITIZEN: ${name}] ${desc}`,
                jumlah: amt,
                jenis: 'plus',
                status: 'pending' // Masuk ke antrean approval admin
            }]);

            // Reset Button State
            btn.disabled = false;
            btn.innerHTML = "Send Payment Report";

            if (error) {
                showAlert("Failed to send: " + error.message, "error");
            } else {
                showAlert("✅ Submitted successfully! Please wait for Admin approval.", "success");
                document.getElementById('name').value = '';
                document.getElementById('amt').value = '';
                document.getElementById('desc').value = '';
            }
        }
    </script>
</body>
</html>

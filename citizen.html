<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resident Payment Portal - RT 001/001</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --bg-main: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --success-bg: #dcfce7;
            --success-text: #166534;
            --error-bg: #fee2e2;
            --error-text: #991b1b;
            --pending-bg: #fef3c7;
            --pending-text: #b45309;
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: 'Inter', sans-serif; 
        }

        body { 
            background: var(--bg-main); 
            color: var(--text-main);
            display: flex; 
            justify-content: center; 
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card { 
            background: var(--card-bg); 
            padding: 40px 32px; 
            border-radius: 24px; 
            width: 100%; 
            max-width: 420px; 
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
            position: relative;
        }

        .lang-switch {
            position: absolute;
            top: 24px;
            right: 24px;
            padding: 6px 10px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: #f8fafc;
            color: var(--text-muted);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            outline: none;
            transition: 0.2s;
        }
        
        .lang-switch:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .header-container {
            text-align: center;
            margin-bottom: 32px;
            margin-top: 10px;
        }

        .icon-wrapper {
            font-size: 32px;
            margin-bottom: 12px;
        }

        h3 {
            font-size: 22px;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        p.subtitle {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.5;
        }

        .input-group {
            margin-bottom: 16px;
        }

        .input-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 6px;
        }

        input { 
            width: 100%; 
            padding: 14px 16px; 
            border-radius: 12px; 
            border: 1px solid var(--border-color); 
            background: #f1f5f9;
            font-size: 14px;
            transition: all 0.3s ease;
            color: var(--text-main);
        }

        input::placeholder {
            color: #94a3b8;
        }

        input:focus { 
            outline: none; 
            border-color: var(--primary); 
            background: #ffffff; 
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1); 
        }

        button { 
            width: 100%; 
            padding: 16px; 
            margin-top: 12px;
            border-radius: 12px; 
            background: var(--primary); 
            color: white; 
            border: none; 
            font-weight: 600; 
            font-size: 15px;
            cursor: pointer; 
            transition: all 0.2s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        button:hover { 
            background: var(--primary-dark); 
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            background: #94a3b8;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .alert-box {
            margin-top: 20px;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 500;
            text-align: center;
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .alert-success {
            display: block;
            background: var(--success-bg);
            color: var(--success-text);
            border: 1px solid #bbf7d0;
        }

        .alert-error {
            display: block;
            background: var(--error-bg);
            color: var(--error-text);
            border: 1px solid #fecaca;
        }

        /* --- STYLING UNTUK RIWAYAT PUBLIC --- */
        .history-section {
            margin-top: 24px;
            padding-top: 24px;
            border-top: 1px solid var(--border-color);
        }

        .history-section h4 {
            font-size: 14px;
            color: var(--text-main);
            margin-bottom: 16px;
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .history-item {
            background: #f8fafc;
            border: 1px solid var(--border-color);
            padding: 12px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .history-info { flex: 1; }
        .history-desc { font-size: 12px; font-weight: 600; color: var(--text-main); margin-bottom: 4px; word-break: break-all; }
        .history-date { font-size: 10px; color: var(--text-muted); }
        
        .history-meta { text-align: right; margin-left: 10px; }
        .history-amt { font-size: 13px; font-weight: 700; color: var(--success-text); margin-bottom: 4px; }
        
        .badge {
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 6px;
            font-weight: 600;
            display: inline-block;
        }
        .badge-pending { background: var(--pending-bg); color: var(--pending-text); }
        .badge-approved { background: var(--success-bg); color: var(--success-text); }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="card">
        <select id="langSelect" class="lang-switch" onchange="changeLang(this.value)">
            <option value="en">EN</option>
            <option value="id">ID</option>
        </select>

        <div class="header-container">
            <div class="icon-wrapper">🛡️</div>
            <h3 id="txtTitle">Payment Submission</h3>
            <p class="subtitle" id="txtSubtitle">Securely submit your monthly fees or donations for Admin verification.</p>
        </div>

        <div class="input-group">
            <label for="name" id="lblIdentity">Resident Identity</label>
            <input type="text" id="name" placeholder="e.g. John Doe / Block A-12" oninput="hideAlert()">
        </div>

        <div class="input-group">
            <label for="amt" id="lblAmount">Payment Amount</label>
            <input type="number" id="amt" placeholder="Rp 0" oninput="hideAlert()">
        </div>

        <div class="input-group">
            <label for="desc" id="lblPurpose">Payment Purpose</label>
            <input type="text" id="desc" placeholder="e.g. June Monthly Security Fee" oninput="hideAlert()">
        </div>

        <button id="submitBtn" onclick="submitData()">
            Send Payment Report
        </button>

        <div id="msgBox" class="alert-box"></div>

        <div class="history-section">
            <h4 id="txtHistTitle">Recent Submissions</h4>
            <div id="historyList" class="history-list">
                </div>
        </div>
    </div>

    <script>
        const SB_URL = 'https://ltndiinbhxpstzkfroqc.supabase.co';
        const SB_KEY = 'sb_publishable_nhL1q3f6pZvD396R-T_N9Q_JE996i25';
        const sbClient = supabase.createClient(SB_URL, SB_KEY);

        // --- MULTI-LANGUAGE SYSTEM ---
        let currentLang = localStorage.getItem('citizenLang') || 'en';

        const i18n = {
            en: {
                title: "Payment Submission",
                subtitle: "Securely submit your monthly fees or donations for Admin verification.",
                lblIdentity: "Resident Identity",
                plcIdentity: "e.g. John Doe / Block A-12",
                lblAmount: "Payment Amount",
                lblPurpose: "Payment Purpose",
                plcPurpose: "e.g. June Monthly Security Fee",
                btnSubmit: "Send Payment Report",
                btnLoading: "Submitting...",
                errEmpty: "Please fill out all fields before submitting.",
                errFail: "Failed to send: ",
                okSuccess: "Submitted successfully! Please wait for Admin approval.",
                histTitle: "Recent Submissions",
                histEmpty: "No recent submissions found.",
                statPending: "Pending",
                statApproved: "Approved"
            },
            id: {
                title: "Pengiriman Pembayaran",
                subtitle: "Kirim iuran bulanan atau donasi Anda dengan aman untuk diverifikasi oleh Admin.",
                lblIdentity: "Identitas Warga",
                plcIdentity: "Misal: Budi / Blok A-12",
                lblAmount: "Jumlah Pembayaran",
                lblPurpose: "Keterangan Pembayaran",
                plcPurpose: "Misal: Iuran Keamanan Bulan Juni",
                btnSubmit: "Kirim Laporan Pembayaran",
                btnLoading: "Mengirim...",
                errEmpty: "Harap isi semua kolom sebelum mengirim.",
                errFail: "Gagal mengirim: ",
                okSuccess: "Berhasil dikirim! Harap tunggu persetujuan Admin.",
                histTitle: "Riwayat Terkini",
                histEmpty: "Belum ada riwayat pengiriman.",
                statPending: "Menunggu",
                statApproved: "Disetujui"
            }
        };

        function applyLang() {
            const t = i18n[currentLang];
            document.getElementById('txtTitle').innerText = t.title;
            document.getElementById('txtSubtitle').innerText = t.subtitle;
            document.getElementById('lblIdentity').innerText = t.lblIdentity;
            document.getElementById('name').placeholder = t.plcIdentity;
            document.getElementById('lblAmount').innerText = t.lblAmount;
            document.getElementById('lblPurpose').innerText = t.lblPurpose;
            document.getElementById('desc').placeholder = t.plcPurpose;
            document.getElementById('langSelect').value = currentLang;
            
            document.getElementById('txtHistTitle').innerText = t.histTitle;

            const btn = document.getElementById('submitBtn');
            if (!btn.disabled) {
                btn.innerHTML = t.btnSubmit;
            }
            
            fetchHistory(); // Memuat ulang teks riwayat (Status dsb) dengan bahasa baru
        }

        function changeLang(lang) {
            currentLang = lang;
            localStorage.setItem('citizenLang', lang);
            applyLang();
            hideAlert();
        }

        // --- CORE FUNCTIONS ---
        function hideAlert() {
            document.getElementById('msgBox').className = 'alert-box';
        }

        function showAlert(message, type) {
            const msgBox = document.getElementById('msgBox');
            msgBox.innerText = message;
            msgBox.className = `alert-box alert-${type}`;
        }

        // Mengambil 5 riwayat terakhir dari Supabase
        async function fetchHistory() {
            const list = document.getElementById('historyList');
            const t = i18n[currentLang];
            
            list.innerHTML = `<div style="text-align:center; font-size:12px; color:gray;">Loading...</div>`;

            // Hanya mengambil data 'keterangan' yang diawali dengan '[CITIZEN' jika ingin filter khusus warga.
            // Namun karena format kita pakai awalan itu, kita cukup filter dan ambil 5 terbaru.
            const { data, error } = await sbClient
                .from('transaksi')
                .select('keterangan, jumlah, status, created_at')
                .like('keterangan', '[CITIZEN:%') 
                .order('created_at', { ascending: false })
                .limit(4); // Batasi 4 riwayat agar tampilan card tidak terlalu panjang

            if (error) {
                list.innerHTML = `<div style="text-align:center; font-size:12px; color:var(--error-text);">Failed to load history</div>`;
                return;
            }

            if (!data || data.length === 0) {
                list.innerHTML = `<div style="text-align:center; font-size:12px; color:var(--text-muted);">${t.histEmpty}</div>`;
                return;
            }

            list.innerHTML = '';
            data.forEach(tr => {
                const date = new Date(tr.created_at).toLocaleDateString();
                const amt = parseFloat(tr.jumlah).toLocaleString();
                const isApproved = tr.status === 'approved';
                
                const statText = isApproved ? t.statApproved : t.statPending;
                const badgeClass = isApproved ? 'badge-approved' : 'badge-pending';
                
                // Menghapus tulisan "[CITIZEN: ...]" agar tampilan lebih rapi untuk publik
                // (Opsional, saat ini kita tampilkan apa adanya)
                let descText = tr.keterangan;

                list.innerHTML += `
                    <div class="history-item">
                        <div class="history-info">
                            <div class="history-desc">${descText}</div>
                            <div class="history-date">${date}</div>
                        </div>
                        <div class="history-meta">
                            <div class="history-amt">Rp ${amt}</div>
                            <span class="badge ${badgeClass}">${statText}</span>
                        </div>
                    </div>
                `;
            });
        }

        async function submitData() {
            const name = document.getElementById('name').value.trim();
            const amt = document.getElementById('amt').value.trim();
            const desc = document.getElementById('desc').value.trim();
            const btn = document.getElementById('submitBtn');
            const t = i18n[currentLang]; 

            if (!name || !amt || !desc) {
                showAlert(t.errEmpty, "error");
                return;
            }

            // Set Loading State
            btn.disabled = true;
            btn.innerHTML = t.btnLoading;
            hideAlert();

            const { error } = await sbClient.from('transaksi').insert([{
                keterangan: `[CITIZEN: ${name}] ${desc}`,
                jumlah: amt,
                jenis: 'plus',
                status: 'pending' 
            }]);

            // Reset Button State
            btn.disabled = false;
            btn.innerHTML = t.btnSubmit;

            if (error) {
                showAlert(t.errFail + error.message, "error");
            } else {
                showAlert(t.okSuccess, "success");
                document.getElementById('name').value = '';
                document.getElementById('amt').value = '';
                document.getElementById('desc').value = '';
                
                // Refresh data riwayat setelah berhasil input
                fetchHistory();
            }
        }

        // Jalankan saat pertama kali dimuat
        applyLang();
    </script>
</body>
</html>

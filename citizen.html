<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Citizen Payment Portal</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: sans-serif; background: #f4f7f6; display: flex; justify-content: center; padding: 20px; }
        .card { background: white; padding: 20px; border-radius: 10px; width: 100%; max-width: 400px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        input, button { width: 100%; padding: 12px; margin: 10px 0; border-radius: 5px; border: 1px solid #ddd; }
        button { background: #1e3799; color: white; border: none; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card">
        <h3>🏘️ Submit Payment</h3>
        <p style="font-size:12px; color:#666;">Enter your payment details for Admin verification.</p>
        <input type="text" id="name" placeholder="Full Name / House No.">
        <input type="number" id="amt" placeholder="Amount (Rp)">
        <input type="text" id="desc" placeholder="Purpose (e.g. June Monthly Fee)">
        <button onclick="submit()">Send Payment Report</button>
        <div id="msg" style="font-size:12px; text-align:center;"></div>
    </div>

    <script>
        const SB_URL = 'https://ltndiinbhxpstzkfroqc.supabase.co';
        const SB_KEY = 'sb_publishable_nhL1q3f6pZvD396R-T_N9Q_JE996i25';
        const sbClient = supabase.createClient(SB_URL, SB_KEY);

        async function submit() {
            const name = document.getElementById('name').value;
            const amt = document.getElementById('amt').value;
            const desc = document.getElementById('desc').value;

            const { error } = await sbClient.from('transaksi').insert([{
                keterangan: `[CITIZEN: ${name}] ${desc}`,
                jumlah: amt,
                jenis: 'plus',
                status: 'pending' // Masuk ke antrean approval admin
            }]);

            const msg = document.getElementById('msg');
            if (error) {
                msg.innerText = "Error: " + error.message;
                msg.style.color = "red";
            } else {
                msg.innerText = "Submitted! Please wait for Admin approval.";
                msg.style.color = "green";
                document.getElementById('name').value = '';
                document.getElementById('amt').value = '';
                document.getElementById('desc').value = '';
            }
        }
    </script>
</body>
</html>

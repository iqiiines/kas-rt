<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - RT 001/001</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --bg: #f4f7f6; --white: #fff; --green: #27ae60; --red: #c0392b; --blue: #1e3799; --dark: #2c3e50; --orange: #f39c12; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: var(--bg); padding: 15px; display: flex; justify-content: center; color: #333; }
        .container { width: 100%; max-width: 480px; background: var(--white); padding: 25px; border-radius: 12px; box-shadow: 0 8px 20px rgba(0,0,0,0.08); position: relative; }
        .app-brand { font-family: 'Georgia', serif; font-size: 22px; font-weight: bold; color: var(--blue); text-align: center; margin-bottom: 5px; }
        .app-address { font-size: 11px; color: #777; text-align: center; margin-bottom: 20px; }
        input, select, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #ddd; font-size: 15px; }
        .btn { background: var(--blue); color: white; border: none; font-weight: bold; cursor: pointer; }
        .btn-approve { background: var(--green); padding: 6px 12px; font-size: 12px; width: auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 2px solid #eee; padding-bottom: 15px; }
        .card { background: #fdfdfd; padding: 15px; border-radius: 10px; margin-bottom: 20px; border: 1px solid #eaeaea; text-align: center; }
        .balance { font-size: 28px; font-weight: bold; }
        .plus { color: var(--green); } .minus { color: var(--red); }
        .list-item { display: flex; justify-content: space-between; padding: 12px; background: white; border-left: 5px solid; margin-bottom: 10px; border-radius: 6px; border: 1px solid #f0f0f0; }
        .chart-container { position: relative; height: 180px; width: 100%; margin-bottom: 20px; }
        .pending-box { background: #fff4e5; padding: 15px; border-radius: 10px; border: 1px solid #ffe0b2; margin-bottom: 20px; }
        .modal { display: none; position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; padding: 15px; }
        .modal-content { background: #fff; padding: 25px; border-radius: 12px; width: 100%; max-width: 400px; max-height: 90vh; overflow-y: auto; }
        .setting-section { border-top: 1px solid #eee; margin-top: 15px; padding-top: 10px; }
        label { font-size: 11px; font-weight: bold; color: #666; display: block; margin-top: 5px; }
        @media print { .no-print { display: none !important; } #printHeader { display: block !important; } }
    </style>
</head>
<body>

<div class="container">
    <div id="loginScreen">
        <div class="app-brand">🏘️ PETTY CASH RT 001 / RW 001</div>
        <h2 id="txtLoginTitle" style="text-align:center; font-size:16px; margin-bottom:15px;">Admin Login</h2>
        <input type="email" id="email" placeholder="Email" required>
        <input type="password" id="password" placeholder="Password" required>
        <button id="btnAuth" class="btn" onclick="handleAuth()">Login</button>
        <p id="authToggle" style="font-size:12px; text-align:center; cursor:pointer; color:var(--blue); margin-top:10px;" onclick="toggleAuthMode()">Register New Admin</p>
    </div>

    <div id="appScreen" style="display:none;">
        <div class="header">
            <h3 id="txtAppName">Cashflow Dashboard</h3>
            <button onclick="openSettings()" style="width:auto; padding:5px 10px; font-size:12px;">⚙️ Settings</button>
        </div>

        <div id="pendingBox" class="pending-box">
            <h4 id="txtPendingTitle" style="color:var(--orange); font-size:14px; margin-bottom:10px;">🔔 Pending Requests</h4>
            <div id="pendingList"></div>
        </div>

        <div class="card">
            <div id="txtOpenBal" style="font-size:12px; color:#777;">Opening Balance:</div>
            <div class="balance" id="totalSaldo">Rp 0</div>
            <div style="display:flex; justify-content: space-around; margin-top:10px;">
                <div><small id="txtIn">Total In</small><p class="plus" id="inc">+0</p></div>
                <div><small id="txtOut">Total Out</small><p class="minus" id="exp">-0</p></div>
            </div>
        </div>

        <div class="chart-container"><canvas id="cashflowChart"></canvas></div>

        <form id="txForm" class="no-print">
            <div style="display:flex; gap:5px;">
                <select id="jenis" style="flex:1;"><option value="plus">Income (+)</option><option value="minus">Expense (-)</option></select>
                <input type="number" id="jml" placeholder="Amount" style="flex:2;" required>
            </div>
            <input type="text" id="ket" placeholder="Description" required>
            <button type="submit" class="btn" id="btnSave">Save Transaction</button>
        </form>

        <h4 id="txtHistTitle" style="margin:20px 0 10px;">History</h4>
        <div id="list"></div>
        <button class="btn no-print" style="background:var(--dark); margin-top:10px;" onclick="window.print()">📄 Print Report</button>
    </div>

    <div id="settingsModal" class="modal">
        <div class="modal-content">
            <h3 id="txtSettTitle">Settings</h3>
            <div class="setting-section">
                <label id="lblLang">Language</label>
                <select id="langSelect" onchange="changeLang(this.value)">
                    <option value="en">English</option>
                    <option value="id">Indonesia</option>
                </select>
            </div>
            <div class="setting-section">
                <label id="lblEmail">Update Email</label>
                <input type="email" id="newEmail" placeholder="New Email">
                <button class="btn" style="padding:8px; font-size:12px;" onclick="updateEmail()">Update</button>
                <label id="lblPass">Update Password</label>
                <input type="password" id="newPass" placeholder="Min 6 characters">
                <button class="btn" style="padding:8px; font-size:12px;" onclick="updatePassword()">Update</button>
            </div>
            <button class="btn" style="background:var(--red); margin-top:15px;" onclick="logout()">Logout</button>
            <button class="btn" style="background:#ccc; color:#333;" onclick="closeSettings()">Close</button>
        </div>
    </div>
</div>

<script>
    const SB_URL = 'https://ltndiinbhxpstzkfroqc.supabase.co';
    const SB_KEY = 'sb_publishable_nhL1q3f6pZvD396R-T_N9Q_JE996i25';
    const sbClient = supabase.createClient(SB_URL, SB_KEY);

    let authMode = 'login';
    let currentLang = localStorage.getItem('lang') || 'en';
    let myChart = null;

    const i18n = {
        en: {
            login: "Admin Login", reg: "Register Admin", btnLogin: "Login", btnReg: "Register Now",
            pending: "🔔 Pending Requests", none: "No pending requests", openBal: "Opening Balance: ",
            totalIn: "Total In", totalOut: "Total Out", save: "Save Transaction", history: "History",
            appName: "Cashflow Dashboard", settings: "Settings", lang: "Language", updEmail: "Update Email",
            updPass: "Update Password", logout: "Logout"
        },
        id: {
            login: "Login Pengurus", reg: "Daftar Pengurus", btnLogin: "Masuk", btnReg: "Daftar Sekarang",
            pending: "🔔 Menunggu Persetujuan", none: "Tidak ada antrean", openBal: "Saldo Awal: ",
            totalIn: "Total Masuk", totalOut: "Total Keluar", save: "Simpan Transaksi", history: "Riwayat",
            appName: "Dashboard Kas", settings: "Pengaturan", lang: "Bahasa", updEmail: "Ganti Email",
            updPass: "Ganti Password", logout: "Keluar"
        }
    };

    function applyLang() {
        const t = i18n[currentLang];
        document.getElementById('txtLoginTitle').innerText = (authMode === 'login') ? t.login : t.reg;
        document.getElementById('btnAuth').innerText = (authMode === 'login') ? t.btnLogin : t.btnReg;
        document.getElementById('txtPendingTitle').innerText = t.pending;
        document.getElementById('txtOpenBal').innerText = t.openBal;
        document.getElementById('txtIn').innerText = t.totalIn;
        document.getElementById('txtOut').innerText = t.totalOut;
        document.getElementById('btnSave').innerText = t.save;
        document.getElementById('txtHistTitle').innerText = t.history;
        document.getElementById('txtAppName').innerText = t.appName;
        document.getElementById('txtSettTitle').innerText = t.settings;
        document.getElementById('lblLang').innerText = t.lang;
        document.getElementById('lblEmail').innerText = t.updEmail;
        document.getElementById('lblPass').innerText = t.updPass;
        document.getElementById('langSelect').value = currentLang;
        fetchData();
        fetchPending();
    }

    function changeLang(l) { currentLang = l; localStorage.setItem('lang', l); applyLang(); }

    async function checkUser() {
        const { data: { session } } = await sbClient.auth.getSession();
        if (session) {
            const { data: prof } = await sbClient.from('profiles').select('is_approved').eq('id', session.user.id).single();
            if (prof?.is_approved) {
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('appScreen').style.display = 'block';
                applyLang();
            } else { await sbClient.auth.signOut(); alert("Account needs RT approval."); }
        } else { applyLang(); }
    }

    async function handleAuth() {
        const email = document.getElementById('email').value;
        const pass = document.getElementById('password').value;
        if (authMode === 'login') {
            const { error } = await sbClient.auth.signInWithPassword({ email, password: pass });
            if (error) alert(error.message); else location.reload();
        } else {
            const { error } = await sbClient.auth.signUp({ email, password: pass });
            if (error) alert(error.message); else alert("Registered! Wait for RT approval.");
        }
    }

    function toggleAuthMode() {
        authMode = (authMode === 'login') ? 'register' : 'login';
        applyLang();
    }

    async function fetchData() {
        const { data, error } = await sbClient.from('transaksi').select('*').eq('status', 'approved').order('created_at', {ascending: false});
        if (error) return;
        let inc = 0, exp = 0;
        const list = document.getElementById('list');
        list.innerHTML = '';
        data.forEach(tr => {
            const amt = parseFloat(tr.jumlah);
            tr.jenis === 'plus' ? inc += amt : exp += amt;
            list.innerHTML += `<div class="list-item" style="border-left-color:${tr.jenis==='plus'?'#27ae60':'#c0392b'}">
                <div><b>${tr.keterangan}</b><br><small>${new Date(tr.created_at).toLocaleDateString()}</small></div>
                <div class="${tr.jenis}"><b>Rp ${amt.toLocaleString()}</b></div>
            </div>`;
        });
        document.getElementById('totalSaldo').innerText = `Rp ${(inc - exp).toLocaleString()}`;
        document.getElementById('inc').innerText = `+Rp ${inc.toLocaleString()}`;
        document.getElementById('exp').innerText = `-Rp ${exp.toLocaleString()}`;
        renderChart(inc, exp);
    }

    async function fetchPending() {
        const { data } = await sbClient.from('transaksi').select('*').eq('status', 'pending');
        const container = document.getElementById('pendingList');
        container.innerHTML = (data?.length === 0) ? `<small>${i18n[currentLang].none}</small>` : '';
        data?.forEach(tr => {
            container.innerHTML += `<div style="display:flex; justify-content:space-between; margin-bottom:10px; padding:5px; border-bottom:1px solid #eee;">
                <div style="font-size:12px;"><b>${tr.keterangan}</b><br>Rp ${parseFloat(tr.jumlah).toLocaleString()}</div>
                <button class="btn btn-approve" onclick="approveTx(${tr.id})">Approve</button>
            </div>`;
        });
    }

    async function approveTx(id) {
        await sbClient.from('transaksi').update({ status: 'approved' }).eq('id', id);
        fetchData(); fetchPending();
    }

    document.getElementById('txForm').onsubmit = async (e) => {
        e.preventDefault();
        const { error } = await sbClient.from('transaksi').insert([{
            keterangan: document.getElementById('ket').value,
            jumlah: document.getElementById('jml').value,
            jenis: document.getElementById('jenis').value,
            status: 'approved'
        }]);
        if (!error) { e.target.reset(); fetchData(); }
    };

    function renderChart(i, e) {
        const ctx = document.getElementById('cashflowChart').getContext('2d');
        if (myChart) myChart.destroy();
        myChart = new Chart(ctx, {
            type: 'doughnut',
            data: { labels: ['In', 'Out'], datasets: [{ data: [i, e], backgroundColor: ['#27ae60', '#c0392b'] }] },
            options: { responsive: true, maintainAspectRatio: false }
        });
    }

    async function updateEmail() {
        const email = document.getElementById('newEmail').value;
        const { error } = await sbClient.auth.updateUser({ email });
        alert(error ? error.message : "Confirmation link sent to new email.");
    }

    async function updatePassword() {
        const password = document.getElementById('newPass').value;
        const { error } = await sbClient.auth.updateUser({ password });
        alert(error ? error.message : "Password updated!");
    }

    function openSettings() { document.getElementById('settingsModal').style.display = 'flex'; }
    function closeSettings() { document.getElementById('settingsModal').style.display = 'none'; }
    async function logout() { await sbClient.auth.signOut(); location.reload(); }

    checkUser();
</script>
</body>
</html>
